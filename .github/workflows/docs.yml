name: Docs

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/busy_beaver_ci.yml'
      - '.github/workflows/lean_action_ci.yml'
      - '.github/workflows/create-release.yml'
      - '.github/workflows/update.yml'
      - 'BusyBeaver/BB6/Halt/**'
      - 'BusyBeaver/BB6/NonHalt/**'
      - 'BusyBeaver/BB6/Cryptids/**'
      - 'BusyBeaver/Calculi/**'
      - 'BusyBeaver.lean'
      - 'comparator/**'
      - 'verify.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: docs-build
      cancel-in-progress: true

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Compute documented Lean targets from literate.toml
        id: docs-targets
        run: python3 .github/scripts/busy_beaver_ci_shards.py docs-args

      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          build-args: ${{ steps.docs-targets.outputs.build_args }}
          test: false
          lint: false
        env:
          LEAN_NUM_THREADS: "1"

      - name: Restore Verso literate build cache
        id: verso-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .lake/packages/verso/.lake/build
            .lake/packages/subverso/.lake/build
            .lake/packages/MD4Lean/.lake/build
            .lake/packages/illuminate/.lake/build
            .lake/build/literate
          key: verso-literate-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'literate.toml') }}-${{ github.sha }}
          restore-keys: |
            verso-literate-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'literate.toml') }}-
            verso-literate-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build Verso literate HTML
        id: verso
        timeout-minutes: 150
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          # Work around Verso v4.35.0-rc4 passing `module`-mode setup.importArts (which omits
          # `.olean.private`) to `importModules (level := .private)` in `verso-literate`, and enable
          # KaTeX math rendering (`MD_FLAG_LATEXMATHSPANS` + `.math.inline`/`.math.display`) in
          # Markdown docstrings.
          sed -i 's/let setup ← ModuleSetup.load file/let _setup ← ModuleSetup.load file/; s/importArts := setup.importArts/importArts := {}/; s/MD4Lean\.parse (stx\[1\]\.getAtomVal\.dropSuffix "-\/")\.copy/MD4Lean.parse (stx[1].getAtomVal.dropSuffix "-\/").copy (MD4Lean.MD_DIALECT_GITHUB ||| MD4Lean.MD_FLAG_LATEXMATHSPANS)/; s/MD4Lean\.parse x/MD4Lean.parse x (MD4Lean.MD_DIALECT_GITHUB ||| MD4Lean.MD_FLAG_LATEXMATHSPANS)/' .lake/packages/verso/src/verso-literate/VersoLiterateMain.lean
          sed -i 's/| \.latexMath _x => \.empty -- TODO/| .latexMath x => {{<code class="math inline">{{String.join x.toList}}<\/code>}}/; s/| \.latexMathDisplay _x => \.empty -- TODO/| .latexMathDisplay x => {{<code class="math display">{{String.join x.toList}}<\/code>}}/' .lake/packages/verso/src/verso-literate-code/VersoLiterateCode.lean
          path=$(lake query :literateHtml)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Save Verso literate build cache
        # Persist partial `.lake/build/literate/*.json` progress even if `verso` hits its step
        # timeout, avoiding a cold-cache timeout loop.
        if: >-
          ${{ !cancelled() &&
              steps.verso-cache.outputs.cache-hit != 'true' &&
              (success() || steps.verso.outcome == 'failure') }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .lake/packages/verso/.lake/build
            .lake/packages/subverso/.lake/build
            .lake/packages/MD4Lean/.lake/build
            .lake/packages/illuminate/.lake/build
            .lake/build/literate
          key: verso-literate-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'literate.toml') }}-${{ github.sha }}

      - name: Reclaim build disk space before Pages upload
        run: rm -rf .lake/packages/mathlib .lake/build/lib .lake/build/ir

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ steps.verso.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
