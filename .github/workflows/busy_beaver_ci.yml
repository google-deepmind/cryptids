name: BusyBeaver CI

on:
  push:
    paths:
      - 'BusyBeaver/**'
      - 'BusyBeaver.lean'
      - 'BusyBeaverChallenge.lean'
      - 'Cryptids/Machines.lean'
      - 'comparator/busy_beaver.json'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/busy_beaver_ci.yml'
  pull_request:
    paths:
      - 'BusyBeaver/**'
      - 'BusyBeaver.lean'
      - 'BusyBeaverChallenge.lean'
      - 'Cryptids/Machines.lean'
      - 'comparator/busy_beaver.json'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/busy_beaver_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free runner disk space and install bubblewrap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build-args: "BusyBeaver BusyBeaverChallenge"

      - name: Verify BusyBeaver against BusyBeaverChallenge with comparator
        run: lake comparator --config comparator/busy_beaver.json
