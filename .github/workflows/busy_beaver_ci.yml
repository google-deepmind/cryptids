name: BusyBeaver CI

on:
  push:
    paths:
      - 'BusyBeaver/**'
      - '!BusyBeaver/**/*.md'
      - '!BusyBeaver/*.md'
      - 'BusyBeaver.lean'
      - 'BusyBeaverChallenge.lean'
      - 'Cryptids/Machines.lean'
      - 'comparator/busy_beaver.json'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'tools/**'
      - 'CORE_MANIFEST.json'
      - '.github/workflows/busy_beaver_ci.yml'
  pull_request:
    paths:
      - 'BusyBeaver/**'
      - '!BusyBeaver/**/*.md'
      - '!BusyBeaver/*.md'
      - 'BusyBeaver.lean'
      - 'BusyBeaverChallenge.lean'
      - 'Cryptids/Machines.lean'
      - 'comparator/busy_beaver.json'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'tools/**'
      - 'CORE_MANIFEST.json'
      - '.github/workflows/busy_beaver_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free runner disk space and install bubblewrap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check BusyBeaverChallenge is synchronized with Defs
        run: python3 tools/render_challenge.py --check
      - name: Verify core manifest
        run: python3 tools/check_manifest.py
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          build-args: "BusyBeaver BusyBeaverChallenge"
        env:
          LEAN_NUM_THREADS: "1"

      - name: Verify BusyBeaver against BusyBeaverChallenge with comparator
        run: lake comparator --config comparator/busy_beaver.json
