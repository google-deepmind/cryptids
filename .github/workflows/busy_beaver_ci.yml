name: BusyBeaver CI

on:
  push:
    paths:
      - 'BusyBeaver/**'
      - 'BusyBeaver.lean'
      - 'BusyBeaverChallenge.lean'
      - 'Cryptids/Machines.lean'
      - 'comparator/busy_beaver.json'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/busy_beaver_ci.yml'
  pull_request:
    paths:
      - 'BusyBeaver/**'
      - 'BusyBeaver.lean'
      - 'BusyBeaverChallenge.lean'
      - 'Cryptids/Machines.lean'
      - 'comparator/busy_beaver.json'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/busy_beaver_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free runner disk space, set up swap, and install bubblewrap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          build-args: "BusyBeaver BusyBeaverChallenge"

      - name: Verify BusyBeaver against BusyBeaverChallenge with comparator
        run: lake comparator --config comparator/busy_beaver.json
