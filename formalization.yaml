    type: "original-proof"
    relationship: "other"
    note: >-
      First Lean 4 proof that erdos_15 halts iff Erdős's conjecture on powers
      of two is false (Cryptids/Erdos15.lean, Cryptids/Semantics/Erdos15.lean).
  - title: "Cryptids (bbchallenge wiki): 14-state Erdős powers-of-two machine"
    authors:
