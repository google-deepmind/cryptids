    relationship: "independent"
    note: >-
      Yijun Leng (2024) constructed the 25-state baseline machine goldbach_25
      and gave the first Lean 4 proof of its Goldbach semantics; our
      Cryptids/Goldbach21.lean and Cryptids/Semantics/Goldbach.lean are
      developed from scratch.
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/main/FormalConjectures/Arxiv/2107.12475/CollatzLike.lean"
    relationship: "independent"
    note: >-
      Formal Conjectures states the conjecture behind erdos_ternary_15 and
      erdos_ternary_14 as Arxiv.«2107.12475».CollatzLike (for n > 8,
      2 ∈ Nat.digits 3 (2 ^ n)), the same statement as ErdosTernaryConjecture,
      with a TODO for the 15-state Turing machine version.
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/main/FormalConjectures/ErdosProblems/406.lean"
    relationship: "independent"
    note: >-
      Erdős Problem 406 (only finitely many powers of 2 use just the base-3
      digits 0 and 1) is a weaker form; ErdosTernaryConjecture implies it.

status:
  scope: >-
    All three ZF machine-to-proof-search equivalences (zf_393, zf_380, zf_432)
    and the state-reduction halting equivalences for goldbach_21, zf_380,
    riemann_104, and erdos_ternary_14 (along with all five candidate_fewer_states
    theorems, 12 theorems total) are proved constructively using only propext and Quot.sound
    (zero Classical.choice, audited via comparator/constructive.json so
    classical Con(ZF) shortcuts such as Soundness.lean's not_zfInconsistent are
    excluded; this establishes a constructive meta-level correspondence in Lean
    rather than internalizing the reduction inside PA/ZF). The classical
    end-to-end
    semantics—unconditional ZF non-halting via soundness in Mathlib's ZFSet.{0}
    (Cryptids/Semantics/Zf/Soundness.lean), negated-Pi_1^0 Goldbach semantics
    (Cryptids/Semantics/Goldbach.lean), and complex-analytic Riemann Hypothesis
    semantics for riemann_744 (Cryptids/Semantics/Riemann.lean), Shunia's
    120-state machine riemann_120, riemann_104
    (Cryptids/Semantics/Riemann120.lean), and the 95-state arithmetic-stage
    reduction riemann_95 (Cryptids/Riemann95.lean,
    Cryptids/Semantics/Riemann95.lean)—are proved with zero sorrys. The
    15-state machine erdos_ternary_15 satisfies Halts erdosTernary15 <-> ∃ n, 8 < n ∧ 2 ∉ pw n
    constructively (Cryptids/ErdosTernary15.lean, pw = base-3 digits of 2^n by
    repeated doubling) and Halts erdosTernary15 <-> ¬ ErdosTernaryConjecture via
    Mathlib's Nat.digits (Cryptids/Semantics/ErdosTernary15.lean). The 14-state
    machine erdos_ternary_14 satisfies Halts erdosTernary14 <-> ∃ n, 8 < n ∧ 2 ∉ pw n and
    hence Halts candidate <-> Halts reference against erdos_ternary_15 constructively
    (Cryptids/ErdosTernary14.lean), and Halts candidate <-> ¬
    ErdosTernaryConjecture (Cryptids/Semantics/ErdosTernary14.lean). The 28-state
    machine brocard_28 satisfies Halts brocard28 <-> ∃ n, 8 ≤ n ∧ IsTri (n! / 8) and
    Halts brocard28 <-> ∃ n, 7 < n ∧ IsSquare (n! + 1) constructively
    (Cryptids/Brocard28.lean, Cryptids/Semantics/Brocard28.lean), and
    Halts brocard28 <-> ¬ BrocardConjecture with Markov's Principle. The 21-state
    machine legendre_21 satisfies Halts legendre21 <-> ∃ n, 1 ≤ n ∧ ∀ p, p.Prime ->
    ¬ (n ^ 2 < p ∧ p < (n + 1) ^ 2) constructively (Cryptids/Legendre21.lean,
    Cryptids/Semantics/Legendre21.lean), and Halts legendre21 <-> ¬ LegendreConjecture
    with Markov's Principle.
