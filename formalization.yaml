# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Cryptids: Certified State Reductions and Semantics of Conjecture-Checking Turing Machines"
  description: >-
    Formal Lean 4 verification of 2-symbol Turing machines for Goldbach's
    Conjecture (25 -> 21 states), ZF Set Theory Consistency (393 -> 380 states
    reducing Andrew Wade's August 2026 machine zf_393, plus Wade's August 2025
    432-state machine zf_432), and the Riemann Hypothesis (120 -> 104 -> 95
    states reducing Joseph M. Shunia's September 2026 machine riemann_120, plus
    the 2016 744-state machine riemann_744), and Erdős's ternary conjecture
    (15 -> 14 states: Tristan Stérin and Damien Woods's 2021 15-state
    machine erdos_ternary_15 and Tristan Stérin's October 2026 14-state machine
    erdos_ternary_14), Brocard's problem (a new 28-state machine brocard_28,
    November 2026), and Legendre's conjecture (a new 21-state machine legendre_21,
    November 2026),
    proving halting equivalences and connecting every machine's blank-tape
    halting behavior to the corresponding statement in Mathlib.
  authors:
    - "Maxence Faldor"
    - "Moritz Firsching"
  responsible_maintainers:
    - "Maxence Faldor"
    - "Moritz Firsching"
  license: "Apache-2.0"

classification:
  arxiv:
    - "math.LO"
    - "math.NT"
  msc2020:
    - "03D10"
    - "03E30"
    - "11A63"
    - "11M26"
    - "11P32"
    - "68Q04"

