# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Cryptids: Certified State Reductions and Semantics of Conjecture-Checking Turing Machines"
  description: >-
    Formal Lean 4 verification of 2-symbol Turing machines for Goldbach's
    Conjecture (25 -> 21 states), ZF Set Theory Consistency (393 -> 380 states
    reducing Andrew Wade's August 2026 machine zf_393, plus Wade's August 2025
    432-state machine zf_432), and the Riemann Hypothesis (120 -> 104 -> 95
    states reducing Joseph M. Shunia's September 2026 machine riemann_120, plus
    the 2016 744-state machine riemann_744), and Erdős's conjecture on powers
    of two (15 -> 14 states: Tristan Stérin and Damien Woods's 2021 15-state
    machine erdos_15 and Tristan Stérin's October 2026 14-state machine
    erdos_14),
    proving halting equivalences and connecting every machine's blank-tape
    halting behavior to the corresponding statement in Mathlib.
  authors:
    - "Maxence Faldor"
    - "Moritz Firsching"
  responsible_maintainers:
    - "Maxence Faldor"
    - "Moritz Firsching"
  license: "Apache-2.0"

classification:
  arxiv:
    - "math.LO"
    - "math.NT"
  msc2020:
    - "03D10"
    - "03E30"
    - "11A63"
    - "11M26"
    - "11P32"
    - "68Q04"

sources:
  - title: "Certified State Reductions and Formal Semantics of Conjecture-Checking Turing Machines (goldbach_21, zf_380, zf_393, zf_432, riemann_104, riemann_120, riemann_744)"
    authors:
      - "Maxence Faldor"
      - "Moritz Firsching"
    type: "original-proof"
    relationship: "other"
    note: >-
      Original state reductions (goldbach_25 -> 21, zf_393 -> 380,
      riemann_120 -> 104), halting-equivalence proofs, and first Lean 4
      semantics proofs across all five baseline and record conjecture-checking
      Turing machine families (goldbach_25/21, zf_393/380, zf_432,
      riemann_120/104, and riemann_744), including the formal discovery of the
      B6a register-restoration bug in zf_432_wade.tm.
  - title: "A Relatively Small Turing Machine Whose Behavior Is Independent of ZFC"
    authors:
      - "Adam Yedidia"
      - "Scott Aaronson"
    id: "https://arxiv.org/abs/1605.04343"
    type: "article"
    relationship: "background"
    author_endorsement: "not-contacted"
  - title: "metamath-turing-machines (riemann.nql and zf2.nql)"
    authors:
      - "Stefan O'Rear"
      - "Yuri Matiyasevich"
      - "Scott Aaronson"
    id: "https://github.com/sorear/metamath-turing-machines"
    type: "software"
    relationship: "background"
    author_endorsement: "not-contacted"
  - title: "turing_machine_explorer (zf2.py / zf_432 and Aug 2026 393-state update)"
    authors:
      - "Andrew Wade"
    id: "https://codeberg.org/ajwade/turing_machine_explorer"
    type: "software"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Provides both the August 2025 432-state baseline zf_432_wade.tm (commit
      33b30300, formalized end-to-end in Cryptids/Semantics/Zf.lean) and the
      August 2026 393-state machine zf_393_wade.tm (commit 9c5c2e82, formalized
      end-to-end in Cryptids/Zf393.lean and Cryptids/Semantics/Zf393.lean and
      reduced here to 380 states in Cryptids/Zf380.lean).
  - title: "A 120-State Binary Turing Machine Equivalent to the Riemann Hypothesis"
    authors:
      - "Joseph M. Shunia"
    id: "https://arxiv.org/abs/2609.30306"
    type: "article"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Constructs the 120-state binary Turing machine riemann_120 equivalent to
      the Riemann Hypothesis via a 5-register self-sieving recurrence and
      offset base-n digit count (September 2026); formalized end-to-end here in
      Cryptids/Riemann120.lean and Cryptids/Semantics/Riemann120.lean and
      reduced to 104 states in Cryptids/Riemann104.lean.
