automation:
  methods:
    - method: "agent"
      models:
        - "Gemini Argon"
      framework: "Antigravity + experimental harness"
      tool_setup: "Lean 4 (v4.35.0-rc4), Mathlib"
      cost:
        wall_time: ""
        spend_usd: ""
        hardware: ""
      prompting_notes: ""
    - method: "agent"
      models:
        - "Claude Opus 5.5"
      framework: "Claude Code"
      tool_setup: "Lean 4 (v4.35.0-rc4), Mathlib"
      prompting_notes: >-
        Used as assistant for the erdos_15 and erdos_14 proofs
        (Cryptids/Erdos15.lean, Cryptids/Semantics/Erdos15.lean,
        Cryptids/Erdos14.lean, Cryptids/Semantics/Erdos14.lean).
  spend_usd: ""
  notes: >-
    Candidate state reductions and halting-equivalence proofs were discovered
    using Gemini Argon with an experimental harness; end-to-end
    semantics proofs were developed interactively using Gemini Argon. The
    erdos_15 machine is by Tristan Stérin and Damien Woods and the erdos_14
    machine by Tristan Stérin; the erdos_15 and erdos_14 proofs were written
    by Daniel Veljanoski with Claude (Anthropic) as assistant.

fidelity:
  divergences: >-
    During the formal verification of zf_432_wade.tm (Cryptids/Semantics/Zf/Subroutines.lean),
    we discovered that the baseline machine zf_432_wade.tm was compiled prior to
    Andrew Wade's commit 10fcf152b3 ("Bugfix for B6a where correct variables were
    not being restored"), causing state 299 (main().n_140.1) to restore scratch1
    into param1 instead of param3. We formalize both the exact 20-clause system
    WadeZFProvable enumerated by zf_432_wade.tm and O'Rear's intended Hilbert
    system ZFProvable (proved sound in Mathlib's ZFSet.{0}), which zf_393
    (compiled after commit 10fcf152b3) enumerates directly.

review:
  status: "self-assessed"
  reviewers:
    - "Maxence Faldor"
    - "Moritz Firsching"
    - "Eric Wieser"
  notes: "Verified with Lean 4 (v4.35.0-rc4), leanprover/comparator, and standalone Python verifier verify.py."

