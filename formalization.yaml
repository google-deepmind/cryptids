  - title: "A 21-state Turing machine for Legendre's conjecture with Lean 4 proofs (legendre_21)"
    authors:
      - "Daniel Veljjanoski"
    type: "original-proof"
    relationship: "other"
    note: >-
      New machine (artifacts/legendre_21/machine.txt) built on the primality test of
      goldbach_21, and first Lean 4 proofs that it halts iff some n >= 1 has no prime
      strictly between n^2 and (n+1)^2 (Cryptids/Legendre21.lean,
      Cryptids/Semantics/Legendre21.lean). The proof uses the lemmas of
      Cryptids/Goldbach21.lean for the test.

related_formalizations:
