    id: "https://wiki.bbchallenge.org/w/index.php?title=Cryptids&oldid=9722"
    type: "web post"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The 14-state, 2-symbol machine erdos_14
      (1LB1RA_1LC1LB_0RD0RA_1LM0RE_1LF1RE_0LJ1LG_1RK0LH_1RI1LH_0LJ0RE_0RD1LJ_0LL1RK_1RN0LC_0LN---_0RK0LM),
      announced by Tristan Stérin on the bbchallenge Discord in October 2026
      (https://discord.com/channels/960643023006490684/1561295445312151622/1562203343114473472)
      and listed on the wiki (revision 9722, 28 Oct 2026) as not independently
      verified as of October 2026; stored as
      artifacts/erdos_14/machine.txt and formalized here in
      Cryptids/Erdos14.lean and Cryptids/Semantics/Erdos14.lean.
  - title: "Lean 4 formalization of the 14-state Erdős powers-of-two machine (erdos_14)"
    authors:
      - "Daniel Veljanoski"
    type: "original-proof"
    relationship: "other"
    note: >-
      First Lean 4 proof that erdos_14 halts iff erdos_15 halts, and hence iff
      Erdős's conjecture on powers of two is false (Cryptids/Erdos14.lean,
      Cryptids/Semantics/Erdos14.lean).

related_formalizations:
  - id: "https://github.com/lengyijun/goldbach_tm"
    relationship: "independent"
    note: >-
      Yijun Leng (2024) constructed the 25-state baseline machine goldbach_25
      and gave the first Lean 4 proof of its Goldbach semantics; our
      Cryptids/Goldbach21.lean and Cryptids/Semantics/Goldbach.lean are
      developed from scratch.

status:
  scope: >-
    All three ZF machine-to-proof-search equivalences (zf_393, zf_380, zf_432)
    and the state-reduction halting equivalences for goldbach_21, zf_380,
    riemann_104, and erdos_14 (along with all five candidate_fewer_states
    theorems, 12 theorems total) are proved constructively using only propext and Quot.sound
    (zero Classical.choice, audited via comparator/constructive.json so
    classical Con(ZF) shortcuts such as Soundness.lean's not_zfInconsistent are
    excluded; this establishes a constructive meta-level correspondence in Lean
    rather than internalizing the reduction inside PA/ZF). The classical
    end-to-end
    semantics—unconditional ZF non-halting via soundness in Mathlib's ZFSet.{0}
    (Cryptids/Semantics/Zf/Soundness.lean), negated-Pi_1^0 Goldbach semantics
    (Cryptids/Semantics/Goldbach.lean), and complex-analytic Riemann Hypothesis
    semantics for riemann_744 (Cryptids/Semantics/Riemann.lean), Shunia's
    120-state machine riemann_120, riemann_104
    (Cryptids/Semantics/Riemann120.lean), and the 95-state arithmetic-stage
    reduction riemann_95 (Cryptids/Riemann95.lean,
    Cryptids/Semantics/Riemann95.lean)—are proved with zero sorrys. The
    15-state machine erdos_15 satisfies Halts erdos15 <-> ∃ n, 8 < n ∧ 2 ∉ pw n
    constructively (Cryptids/Erdos15.lean, pw = base-3 digits of 2^n by
    repeated doubling) and Halts erdos15 <-> ¬ ErdosPowersOfTwoConjecture via
    Mathlib's Nat.digits (Cryptids/Semantics/Erdos15.lean). The 14-state
    machine erdos_14 satisfies Halts erdos14 <-> ∃ n, 8 < n ∧ 2 ∉ pw n and
    hence Halts candidate <-> Halts reference against erdos_15 constructively
    (Cryptids/Erdos14.lean), and Halts candidate <-> ¬
    ErdosPowersOfTwoConjecture (Cryptids/Semantics/Erdos14.lean).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "ConjectureMachines.Goldbach21.candidate_fewer_states"
