[metadata]
title = "Cryptids & Busy Beaver"
description = "Formally verified conjecture-checking and Busy Beaver Turing machines in Lean 4."

[[targets]]
library = "Cryptids"

[[targets]]
library = "BusyBeaverChallenge"

# Render human-authored BusyBeaver definitions, certificate frameworks,
# equivalence/hardness analyses, and named case studies (`A6`, `Pomme`,
# `WilyCoyote`) without running full SubVerso hover elaboration on hundreds of
# generated `M_*` holdout proof scripts and `Calculi` data tables.
[[targets]]
library = "BusyBeaver"
module = "BusyBeaver.Defs"

[[targets]]
library = "BusyBeaver"
module = "BusyBeaver.Basic"

[[targets]]
library = "BusyBeaver"
module = "BusyBeaver.Bridge"

[[targets]]
library = "BusyBeaver"
module = "BusyBeaver.Cert"

[[targets]]
library = "BusyBeaver"
module = "BusyBeaver.WordRLE"

[[targets]]
library = "BusyBeaver"
module = "BusyBeaver.AffRLE"

[[targets]]
